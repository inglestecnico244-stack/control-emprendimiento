<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Control de Emprendimiento</title>
  
  <!-- Tipografía moderna -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- ESTILOS CSS REFINADOS -->
  <style>
    :root {
      --bg-color: #0F172A;
      --card-bg: #1E293B;
      --sidebar-bg: #0B1120;
      --text-primary: #F8FAFC;
      --text-secondary: #94A3B8;
      --primary-color: #6366F1;
      --primary-hover: #4F46E5;
      --alert-color: #EF4444;
      --border-color: #334155;
      --radius: 12px;
      --shadow-sm: 0 4px 6px -1px rgba(0, 0, 0, 0.2), 0 2px 4px -2px rgba(0, 0, 0, 0.2);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-primary);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }

    .app-container {
      display: flex;
      min-height: 100vh;
      flex-direction: column;
    }

    @media (min-width: 768px) {
      .app-container {
        flex-direction: row;
      }
    }

    /* BARRA LATERAL / NAVEGACIÓN */
    .sidebar {
      width: 100%;
      background-color: var(--sidebar-bg);
      border-bottom: 1px solid var(--border-color);
      padding: 1.25rem 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 1.25rem;
    }

    @media (min-width: 768px) {
      .sidebar {
        width: 260px;
        min-width: 260px;
        border-bottom: none;
        border-right: 1px solid var(--border-color);
        padding: 2rem 1.5rem;
        gap: 2rem;
      }
    }

    .brand {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    @media (min-width: 768px) {
      .brand {
        display: block;
      }
    }

    .brand h2 {
      font-size: 1.35rem;
      font-weight: 700;
      color: #FFF;
      letter-spacing: -0.02em;
    }

    .brand .tag {
      display: inline-block;
      font-size: 0.75rem;
      font-weight: 600;
      background: rgba(99, 102, 241, 0.15);
      color: #818CF8;
      padding: 0.25rem 0.6rem;
      border-radius: 6px;
      margin-top: 0.25rem;
    }

    .menu {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
    }

    @media (min-width: 768px) {
      .menu {
        flex-direction: column;
      }
    }

    .nav-btn {
      flex: 1;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      padding: 0.75rem 1rem;
      text-align: center;
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 500;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    @media (min-width: 768px) {
      .nav-btn {
        text-align: left;
      }
    }

    .nav-btn:hover, .nav-btn.active {
      background-color: var(--card-bg);
      color: var(--text-primary);
      border-color: var(--border-color);
    }

    /* CONTENIDO PRINCIPAL */
    .content {
      flex: 1;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
      width: 100%;
    }

    @media (min-width: 768px) {
      .content {
        padding: 2.5rem;
        gap: 2rem;
      }
    }

    /* MÉTRICAS */
    .header-metrics {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
    }

    @media (min-width: 768px) {
      .header-metrics {
        gap: 1.5rem;
      }
    }

    .card-metric {
      background-color: var(--card-bg);
      padding: 1.25rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    .metric-title {
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--text-secondary);
    }

    .card-metric h3 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-top: 0.4rem;
      color: #FFF;
    }

    .card-metric.alert h3 {
      color: var(--alert-color);
    }

    /* SECCIONES Y TARJETAS */
    .card-section {
      background-color: var(--card-bg);
      padding: 1.25rem;
      border-radius: var(--radius);
      border: 1px solid var(--border-color);
      box-shadow: var(--shadow-sm);
    }

    @media (min-width: 768px) {
      .card-section {
        padding: 2rem;
      }
    }

    .section-header {
      margin-bottom: 1.25rem;
    }

    .section-header h2 {
      font-size: 1.2rem;
      font-weight: 700;
      color: #FFF;
    }

    .section-header p {
      color: var(--text-secondary);
      font-size: 0.875rem;
      margin-top: 0.25rem;
    }

    /* FORMULARIO */
    .grid-form {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1rem;
    }

    @media (min-width: 640px) {
      .grid-form {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (min-width: 1024px) {
      .grid-form {
        grid-template-columns: repeat(3, 1fr);
      }
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
    }

    .form-group label {
      font-size: 0.85rem;
      font-weight: 500;
      color: var(--text-secondary);
    }

    .form-group input {
      background-color: var(--bg-color);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      padding: 0.75rem 1rem;
      border-radius: 8px;
      outline: none;
      font-size: 0.95rem;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .form-group input:focus {
      border-color: var(--primary-color);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.2);
    }

    .form-actions {
      grid-column: 1 / -1;
      margin-top: 0.5rem;
    }

    /* BOTONES */
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0.75rem 1.5rem;
      border-radius: 8px;
      border: none;
      font-weight: 600;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s ease;
      width: 100%;
    }

    @media (min-width: 640px) {
      .btn {
        width: auto;
      }
    }

    .btn-primary {
      background-color: var(--primary-color);
      color: white;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
      transform: translateY(-1px);
    }

    .btn-danger {
      background-color: rgba(239, 68, 68, 0.15);
      color: #FCA5A5;
      border: 1px solid rgba(239, 68, 68, 0.3);
      padding: 0.4rem 0.8rem;
      font-size: 0.85rem;
    }

    .btn-danger:hover {
      background-color: #EF4444;
      color: white;
    }

    /* TABLA RESPONSIVA ADAPTATIVA */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
      border-radius: 8px;
      border: 1px solid var(--border-color);
    }

    .data-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    .data-table th, .data-table td {
      padding: 0.875rem 1rem;
      border-bottom: 1px solid var(--border-color);
      font-size: 0.9rem;
    }

    .data-table th {
      background-color: var(--sidebar-bg);
      color: var(--text-secondary);
      font-weight: 600;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .data-table tbody tr:last-child td {
      border-bottom: none;
    }

    .data-table tbody tr:hover {
      background-color: rgba(255, 255, 255, 0.02);
    }

    .empty-state {
      text-align: center;
      color: var(--text-secondary);
      padding: 3rem 1rem !important;
    }
  </style>
</head>
<body>

  <div class="app-container">
    
    <!-- BARRA LATERAL / NAVEGACIÓN EN MÓVIL -->
    <aside class="sidebar">
      <div class="brand">
        <h2>🚀 MiControl</h2>
        <span class="tag">Emprendedores</span>
      </div>

      <nav class="menu">
        <button class="nav-btn active" id="btn-dashboard">📊 Dashboard</button>
        <button class="nav-btn" id="btn-productos">📦 Productos</button>
        <button class="nav-btn" id="btn-ventas">💰 Ventas</button>
      </nav>
    </aside>

    <!-- CONTENIDO PRINCIPAL -->
    <main class="content">
      
      <!-- HEADER CON MÉTRICAS -->
      <header class="header-metrics">
        <div class="card-metric">
          <span class="metric-title">Ventas Hoy</span>
          <h3 id="metric-ventas">$0,00</h3>
        </div>
        <div class="card-metric">
          <span class="metric-title">Total Productos</span>
          <h3 id="metric-productos">0</h3>
        </div>
        <div class="card-metric alert">
          <span class="metric-title">Stock Bajo</span>
          <h3 id="metric-stock-alerta">0</h3>
        </div>
      </header>

      <!-- SECCIÓN 1: FORMULARIO -->
      <section class="card-section">
        <div class="section-header">
          <h2>Nuevo Producto</h2>
          <p>Registrá tus ítems para llevar el control del stock y los precios.</p>
        </div>

        <form id="form-producto" class="grid-form">
          <div class="form-group">
            <label for="nombre">Nombre del Producto</label>
            <input type="text" id="nombre" placeholder="Ej: Vino Malbec Reserva" required>
          </div>

          <div class="form-group">
            <label for="categoria">Categoría</label>
            <input type="text" id="categoria" placeholder="Ej: Vinos, Bebidas Blancas" required>
          </div>

          <div class="form-group">
            <label for="precio-costo">Precio Costo ($)</label>
            <input type="number" id="precio-costo" step="0.01" placeholder="0.00" required>
          </div>

          <div class="form-group">
            <label for="precio-venta">Precio Venta ($)</label>
            <input type="number" id="precio-venta" step="0.01" placeholder="0.00" required>
          </div>

          <div class="form-group">
            <label for="stock">Stock Inicial</label>
            <input type="number" id="stock" placeholder="0" required>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn-primary">Guardar Producto</button>
          </div>
        </form>
      </section>

      <!-- SECCIÓN 2: TABLA DE INVENTARIO -->
      <section class="card-section">
        <div class="section-header">
          <h2>Inventario Actual</h2>
        </div>

        <div class="table-responsive">
          <table class="data-table">
            <thead>
              <tr>
                <th>Producto</th>
                <th>Categoría</th>
                <th>Costo</th>
                <th>Venta</th>
                <th>Stock</th>
                <th>Acciones</th>
              </tr>
            </thead>
            <tbody id="tabla-productos-body">
              <tr>
                <td colspan="6" class="empty-state">No hay productos registrados aún.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

    </main>

  </div>

  <!-- SCRIPTS -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="conexion.js"></script>
  <script src="repositorio.js"></script>
  <script src="app.js"></script>
</body>
</html>
